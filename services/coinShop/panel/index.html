<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荷花管理面板</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
  <main id="login" class="login"><div class="brand-mark">荷</div><h1>荷花管理面板</h1><p id="login-message">请机器人主人私聊发送下方指令，获取限时登录链接。</p><code>#荷花管理面板</code><p class="muted">链接仅可使用一次；登录后浏览器保存限时令牌，机器人重启后仍可使用，每次访问核对主人资格。退出会撤销当前令牌。</p></main>
  <div id="dashboard" hidden>
    <aside class="sidebar"><div class="brand"><span class="brand-mark">荷</span><div><strong>荷花插件</strong><small>管理面板</small></div></div><p class="nav-label">插件设置</p><nav id="categories" aria-label="设置分类"></nav><div class="sidebar-note">与锅巴共用配置</div></aside>
    <div class="main"><header class="topbar"><span>插件管理 / <strong id="breadcrumb">设置</strong></span><div class="session"><span id="expiry" class="muted"></span><button id="logout" class="secondary" type="button">退出</button></div></header>
      <main class="workspace"><div class="page-heading"><div><span class="eyebrow">LOTUS PLUGIN</span><h1 id="section-title">插件设置</h1><p class="muted">保存当前分类的修改。密钥留空保持原值，启动项修改后需重启机器人。</p></div><span id="field-count" class="count"></span></div><form id="config-form"><section id="fields" class="fields"></section><div class="save-bar"><span id="save-status" class="muted" role="status">修改后点击保存</span><button id="save" class="primary" type="submit">保存当前分类</button></div></form></main>
      <footer><!--coin-shop-footer--></footer>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
</body></html>
